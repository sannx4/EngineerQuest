[project]
name = "engineerquest-platform"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "psycopg[binary]==3.2.6", "redis==5.2.1"]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "ruff==0.11.7",
    "mypy==1.15.0",
    "types-redis==4.6.0.20241004",
    "pre-commit==4.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["services/api/src"]
testpaths = ["services/api/tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/api/src", "services/worker"]
